<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | Hairs Me Salon</title>
<meta name="description" content="A warm, family-like salon in Doylestown. Cuts, color, highlights, extensions and keratin, plus manicures and pedicures, from a team with decades behind the chair.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6B2D7A">
<link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--paper:#FAF6F8;--ink:#26192A;--muted:#6A5C6D;--line:#E9DDE6;--brand:#6B2D7A;--accent:#E8C3DA;--accent-ink:#26192A}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Cormorant';src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant';src:url(fonts/cormorant-garamond-latin-500-italic.woff2) format('woff2');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans-latin-wght-normal.woff2) format('woff2');font-weight:100 1000;font-display:swap}
body{background:var(--paper);color:var(--ink);font:400 17px/1.75 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
h1,h2,h3{font-family:'Cormorant',Georgia,serif;font-weight:500;margin:0;line-height:1;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic;color:var(--brand)}
h2{font-size:clamp(44px,5.6vw,76px)}
.lbl{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;color:var(--brand)}
.wash{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}

/* header */
.site-head{position:sticky;top:0;z-index:20;transition:background .3s,box-shadow .3s}
.site-head.scrolled{background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:84px;gap:24px}
.word{font-family:'Cormorant',serif;font-size:30px;text-decoration:none;letter-spacing:.02em}
.word i{color:var(--brand)}
.site-head nav{display:flex;gap:34px;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.site-head nav a{text-decoration:none;opacity:.7}.site-head nav a:hover{opacity:1}
.phi{width:1em;height:1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:500 15px/1 'DM Sans',sans-serif;letter-spacing:.06em;padding:18px 30px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .25s,background .25s,box-shadow .25s}
.btn.main{background:var(--brand);color:#fff;box-shadow:0 14px 30px -14px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn.main:hover{transform:translateY(-2px)}
.btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}

/* hero */
.hero{position:relative;padding:50px 0 110px;overflow:hidden}
.hero .w1{width:520px;height:520px;background:var(--accent);left:-160px;top:-80px}
.hero .w2{width:420px;height:420px;background:color-mix(in srgb,var(--brand) 40%,var(--paper));right:-120px;top:140px}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}
.hero h1{font-size:clamp(58px,8vw,118px);margin:24px 0 28px}
.hero .lead{font-size:19px;color:var(--muted);max-width:30em;margin:0 0 36px}
.actions{display:flex;flex-wrap:wrap;gap:14px}
.rate{display:flex;align-items:center;gap:14px;margin-top:40px;font-size:15px;color:var(--muted)}
.rate b{font-family:'Cormorant',serif;font-size:44px;line-height:1;color:var(--ink);font-weight:500}
.rate .st{color:var(--brand);letter-spacing:3px;display:block}
.pics{position:relative;height:620px}
.pill{position:absolute;right:0;top:0;width:76%;height:100%;border-radius:999px;background:var(--brand) var(--img,none) center/cover no-repeat;box-shadow:0 50px 90px -50px rgba(0,0,0,.5)}
.pill .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:'Cormorant',serif;font-style:italic;font-size:150px;color:#fff;opacity:.35}
.dot{position:absolute;left:0;bottom:60px;width:44%;aspect-ratio:1;border-radius:50%;background:var(--accent) var(--img,none) 70% 30%/260% no-repeat;border:10px solid var(--paper);box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.chip{position:absolute;left:6%;top:70px;background:var(--paper);border-radius:999px;padding:14px 22px;box-shadow:0 20px 40px -20px rgba(0,0,0,.35);font-family:'Cormorant',serif;font-style:italic;font-size:22px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* proof */
.proof ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.proof li{padding:30px 10px;text-align:center}
.proof li+li{border-left:1px solid var(--line)}
.proof b{display:block;font-family:'Cormorant',serif;font-size:32px;font-weight:500;font-style:italic;color:var(--brand)}
.proof span{font-size:14px;color:var(--muted)}

section.band{padding:120px 0;position:relative}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;margin-bottom:60px}
.intro p{color:var(--muted);margin:0;max-width:28em}

/* treatments */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:90px 1fr 1.1fr auto;gap:30px;align-items:center;padding:30px 6px;border-bottom:1px solid var(--line);transition:background .35s,padding .35s}
.list li:hover{background:color-mix(in srgb,var(--accent) 22%,var(--paper));padding-left:22px;padding-right:22px}
.list .n{font-family:'Cormorant',serif;font-style:italic;font-size:30px;color:var(--brand)}
.list h3{font-size:34px}
.list p{margin:0;color:var(--muted)}
.list .pr{font-family:'Cormorant',serif;font-size:24px;font-style:italic;color:var(--brand)}

/* quotes */
.quotes{background:var(--brand);color:#fff;overflow:hidden}
.quotes .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.quotes .q p{font-family:'Cormorant',serif;font-style:italic;font-size:27px;line-height:1.3;margin:18px 0 18px}
.quotes .q::before{content:"\201C";display:block;font-family:'Cormorant',serif;font-size:90px;line-height:.6;color:var(--accent)}
.quotes .lbl{color:#fff;opacity:.7}
.quotes .w3{width:600px;height:600px;background:var(--accent);opacity:.18;right:-200px;top:-200px}

/* path */
.path{max-width:760px;margin:0 auto;list-style:none;padding:0;position:relative}
.path::before{content:"";position:absolute;left:31px;top:10px;bottom:10px;width:1px;background:var(--line)}
.path li{display:grid;grid-template-columns:64px 1fr;gap:28px;padding:0 0 46px;position:relative}
.path li span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--brand);color:var(--brand);font-family:'Cormorant',serif;font-style:italic;font-size:28px;position:relative}
.path h3{font-size:32px;margin:10px 0 6px}.path p{margin:0;color:var(--muted)}

/* visit */
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.card{background:#fff;border-radius:32px;padding:44px;box-shadow:0 30px 60px -40px rgba(0,0,0,.35)}
.addr{font-family:'Cormorant',serif;font-size:clamp(38px,4.4vw,56px);line-height:1.05;margin:18px 0}
.addr em{color:var(--brand)}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:14px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:right;font-weight:600}
.about{color:var(--muted);margin:0 0 30px}

/* request */
.req{display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:start}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font-family:'Cormorant',serif;font-size:36px;text-decoration:none;margin-top:16px}
form input,form textarea,form select{border-radius:14px}
form .btn{width:100%}

.foot{padding:56px 0 64px;border-top:1px solid var(--line)}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:15px}
.callbar{display:none}

@media (max-width:900px){
  .site-head nav,.bar .btn{display:none}
  .hero{padding:24px 0 80px}
  .hero .wrap,.intro,.visit .wrap,.req,.quotes .wrap{grid-template-columns:1fr;gap:44px}
  .pics{height:440px}
  .chip{top:24px;font-size:19px}
  .proof ul{grid-template-columns:1fr}.proof li+li{border-left:0;border-top:1px solid var(--line)}
  .list li{grid-template-columns:52px 1fr;gap:6px 16px;padding:24px 0}
  .list li:hover{padding-left:0;padding-right:0}
  .list p,.list .pr{grid-column:2}
  section.band{padding:80px 0}
  .card{padding:30px 24px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1}
  .foot{padding-bottom:110px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"HairSalon","name":"Hairs Me Salon","telephone":"610-708-3719","address":"3613 Old Easton Rd, Doylestown, PA 18902","email":"hairsme123@gmail.com"}</script>
</head>
<body>
<div class="demo">Concept homepage for Hairs Me Salon, made by a Royersford designer. Not live and not affiliated with the business.</div>

<header class="site-head" id="head"><div class="wrap bar"><a class="word" href="index.html">Hairs Me <i>Salon</i></a></div></header>
<section class="hero"><div class="wrap" style="display:block;max-width:820px">
  <h1>Thank <em>you.</em></h1>
  <p class="lead">We have your note and will be in touch soon. You can also call <a href="tel:+16107083719">610-708-3719</a>.</p>
  <a class="btn ghost" href="index.html">Back to the home page</a>
</div></section>
<script>
(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
  else els.forEach(el => el.classList.add('on'));
})();
</script>
</body>
</html>
