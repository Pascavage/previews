<style>
:root{--paper:#FBF7F0;--ink:#2B2620;--muted:#6E665C;--line:#EFE4D3;--brand:#3F6B4E;--accent:#F2B544;--accent-ink:#2B2620}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-wght-normal.woff2) format('woff2');font-weight:200 1000;font-display:swap}
body{overflow-x:hidden;background:var(--paper);color:var(--ink);font:500 18px/1.6 'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:0 26px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.02;letter-spacing:-.025em}
h2{font-size:clamp(36px,4.8vw,58px)}
.tint{--t:color-mix(in srgb,var(--brand) 9%,var(--paper))}
.tag{display:inline-block;background:color-mix(in srgb,var(--accent) 30%,#fff);color:var(--ink);font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px}

/* header: floating pill */
.site-head{position:sticky;top:12px;z-index:20;padding:0 14px}
.bar{max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 10px 10px 16px;border-radius:999px;background:#fff;box-shadow:0 6px 24px -10px rgba(0,0,0,.18);transition:background .3s}
.site-head.scrolled .bar{background:color-mix(in srgb,#fff 75%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-size:19px}
.logo .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:15px;font-weight:900}
.site-head nav{display:flex;gap:6px;font-weight:700;font-size:16px}
.site-head nav a{text-decoration:none;padding:8px 14px;border-radius:999px}.site-head nav a:hover{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.phi{width:1em;height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 17px/1 'Nunito',sans-serif;padding:17px 26px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 10px 0 -4px color-mix(in srgb,var(--brand) 60%,#000)}
.btn.sec{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:12px 18px;font-size:15px}

/* hero */
.hero{position:relative;padding:70px 0 120px;background:color-mix(in srgb,var(--brand) 10%,var(--paper));margin-top:-70px;padding-top:140px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;position:relative}
.hero h1{font-size:clamp(48px,6.6vw,92px);margin:18px 0 22px}
.hero h1 .u{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 70%,transparent) 62% 92%,transparent 92%)}
.hero .lead{font-size:20px;color:var(--muted);margin:0 0 32px;max-width:30em}
.actions{display:flex;flex-wrap:wrap;gap:14px}
.blob-wrap{position:relative}
.blob{aspect-ratio:1;border-radius:58% 42% 52% 48% / 46% 56% 44% 54%;background:var(--brand) var(--img,none) center/cover no-repeat;animation:morph 14s ease-in-out infinite;box-shadow:0 30px 60px -30px color-mix(in srgb,var(--brand) 80%,transparent)}
.blob .ini{display:grid;place-items:center;height:100%;color:#fff;font-size:120px;font-weight:900;opacity:.3}
@keyframes morph{50%{border-radius:44% 56% 40% 60% / 58% 42% 58% 42%}}
.sticker{position:absolute;right:-6px;top:24px;background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 14px 30px -12px rgba(0,0,0,.25);transform:rotate(6deg);animation:bob 4s ease-in-out infinite;text-align:center}
.sticker b{display:block;font-size:30px;line-height:1;font-weight:900}.sticker b span{color:var(--accent)}
.sticker small{font-size:13px;font-weight:700;color:var(--muted)}
.sticker.two{right:auto;left:-14px;top:auto;bottom:30px;transform:rotate(-5deg);animation-delay:-2s;background:var(--accent);color:var(--accent-ink)}
.sticker.two b{font-size:18px}
@keyframes bob{50%{translate:0 -10px}}
.deco{position:absolute;border-radius:50%;background:var(--accent);opacity:.35}
.wave{display:block;width:100%;height:60px;position:absolute;left:0;bottom:-1px}
.wave.flip{transform:scaleY(-1);top:-1px;bottom:auto}

section.band{padding:100px 0;position:relative}
.head{text-align:center;max-width:700px;margin:0 auto 56px}
.head p{color:var(--muted);margin:14px 0 0}

/* proof */
.proof{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:-28px;position:relative;z-index:2}
.proof div{background:#fff;border-radius:999px;padding:14px 22px;box-shadow:0 10px 26px -14px rgba(0,0,0,.25);font-size:16px;display:flex;gap:8px;align-items:center}
.proof b{font-weight:900}.proof span{color:var(--muted)}

/* services */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cards > div{border-radius:30px;padding:30px 28px;background:color-mix(in srgb,var(--c) 14%,#fff);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.cards > div:hover{transform:translateY(-6px) rotate(-1deg)}
.cards .ic{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:var(--c);color:#fff;margin-bottom:20px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.cards > div:hover .ic{transform:rotate(-10deg) scale(1.08)}
.cards h3{font-size:24px;margin-bottom:8px}.cards p{margin:0;color:var(--muted);font-size:16.5px}
.cards .pr{margin-top:12px;font-weight:900;color:var(--ink)}

/* steps */
.steps{background:color-mix(in srgb,var(--brand) 10%,var(--paper))}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;counter-reset:s;position:relative}
.steps ol::before{content:"";position:absolute;left:12%;right:12%;top:36px;border-top:3px dashed color-mix(in srgb,var(--brand) 35%,transparent)}
.steps li{counter-increment:s;text-align:center;position:relative}
.steps li::before{content:counter(s);display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;font-weight:900;box-shadow:0 0 0 8px color-mix(in srgb,var(--brand) 10%,var(--paper))}
.steps h3{font-size:24px;margin-bottom:8px}.steps p{margin:0;color:var(--muted)}

/* reviews: speech bubbles */
.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:start}
.bubbles figure{margin:0}
.bubbles blockquote{margin:0;background:#fff;border-radius:28px;padding:28px 26px;position:relative;box-shadow:0 14px 34px -18px rgba(0,0,0,.25);font-size:18px}
.bubbles blockquote::after{content:"";position:absolute;left:34px;bottom:-14px;width:28px;height:28px;background:#fff;transform:rotate(45deg);border-radius:4px}
.bubbles figure:nth-child(2){margin-top:34px}
.bubbles figcaption{margin:24px 0 0 26px;font-weight:800;font-size:14px;color:var(--muted)}
.bubbles .st{color:var(--accent);letter-spacing:2px;display:block;margin-bottom:8px}

/* visit */
.visit-card{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;background:var(--brand);color:#fff;border-radius:40px;padding:56px}
.visit-card .addr{font-size:clamp(34px,4vw,50px);font-weight:900;line-height:1.05;margin:16px 0 14px}
.visit-card p{opacity:.85}
.visit-card .tag{background:rgba(255,255,255,.18);color:#fff}
.visit-card .btn.sec{margin-top:10px}
.hours{width:100%;border-collapse:collapse;background:#fff;color:var(--ink);border-radius:26px;overflow:hidden}
.hours td{padding:16px 22px;border-bottom:1px solid var(--line)}.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:800}
.about{margin-top:26px}

/* request */
.req{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start}
.req form{background:#fff;border-radius:34px;padding:36px;box-shadow:0 20px 50px -28px rgba(0,0,0,.3)}
.req form input,.req form textarea,.req form select{border-radius:16px;background:color-mix(in srgb,var(--brand) 5%,#fff)}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font-size:30px;font-weight:900;text-decoration:none;margin-top:18px;color:var(--brand)}

.foot{padding:40px 0 56px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:15px}
.callbar{display:none}

@media (max-width:900px){
  body{font-size:17px}
  .site-head nav,.bar > .btn{display:none}
  .hero{padding:120px 0 90px}
  .hero .wrap,.req,.visit-card{grid-template-columns:1fr;gap:40px}
  .blob-wrap{max-width:400px;margin:0 auto;width:100%}
  .cards,.steps ol,.bubbles{grid-template-columns:1fr}
  .steps ol::before{display:none}
  .bubbles figure:nth-child(2){margin-top:0}
  section.band{padding:76px 0}
  .visit-card{padding:34px 24px;border-radius:30px}
  .req form{padding:26px 18px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1}
  .foot{padding-bottom:110px}
}
.fx{color:var(--ink);padding:100px 0;background:color-mix(in srgb,var(--brand) 7%,var(--paper));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fx h2,.fx h3,.fx h4,.fx dd{color:var(--ink)}
.fx .fxw{max-width:1180px;margin:0 auto;padding:0 28px}
.fx-top{display:flex;justify-content:space-between;align-items:end;gap:28px;flex-wrap:wrap;margin-bottom:40px}
.fx-top p{margin:12px 0 0;max-width:34em;color:var(--muted)}
.fx-eye{display:inline-flex;align-items:center;gap:8px;font:800 12px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.fx-eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.fx-pill{font:700 13px/1 system-ui,sans-serif;padding:10px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.fx-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card,18px);box-shadow:0 24px 50px -36px rgba(0,0,0,.45)}
.fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font:800 16px/1 system-ui,sans-serif;padding:17px 20px;border-radius:var(--r-btn,12px);border:0;background:var(--brand);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}
.fx-btn:hover{transform:translateY(-1px)}.fx-btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.fx-note{margin:12px 0 0;font-size:14px;color:var(--muted);text-align:center}
.fx-done{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,#fff);font-size:15px;line-height:1.45}
.fx-done.on{display:block}
.fx label.l{display:block;font:700 13px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.fx input.t,.fx select.t,.fx textarea.t{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.fx textarea.t{min-height:90px;resize:vertical}
.fx .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fx .chip{position:static;left:auto;top:auto;box-shadow:none;animation:none;font-style:normal}
.chip{font:600 15px/1.2 system-ui,sans-serif;padding:11px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

/* order */
.ord{display:grid;grid-template-columns:1.35fr .9fr;gap:30px;align-items:start}
.ord-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ord-list{padding:8px 26px}
.ord-item{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px dashed var(--line)}
.ord-item:last-child{border-bottom:0}
.ord-item h4{margin:0;font:700 18px/1.25 inherit}
.ord-item p{margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:700 20px/1 system-ui;color:var(--ink);cursor:pointer}
.qty button.add{background:var(--brand);border-color:var(--brand);color:#fff}
.qty output{min-width:22px;text-align:center;font-weight:800}
.ord-grp[hidden]{display:none}
.bag{position:sticky;top:110px;padding:26px}
.bag h3{margin:0 0 6px;font-size:24px}
.bag ul{list-style:none;margin:14px 0 0;padding:0;max-height:220px;overflow:auto}
.bag li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.bag li b{color:var(--brand)}
.bag .empty{color:var(--muted);font-size:15px;padding:14px 0;border:0}

/* book */
.bk{display:grid;grid-template-columns:1.3fr .8fr;gap:30px;align-items:start}
.bk-main{padding:28px 30px 32px}
.bk-main label.l:first-child{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 13px/1.1 system-ui,sans-serif;color:var(--muted)}
.day b{font-size:20px;color:var(--ink)}
.day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}.day[aria-pressed=true] b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 15px/1 system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.slot[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sum{position:sticky;top:110px;padding:26px}
.sum h3{margin:0 0 14px;font-size:24px}
.sum dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15.5px}
.sum dt{color:var(--muted);font-weight:600}.sum dd{margin:0;font-weight:700;text-align:right}

/* quote */
.qt{display:grid;grid-template-columns:1.25fr .85fr;gap:30px;align-items:start}
.qt-main{padding:28px 30px 32px}
.qt-main label.l:first-child{margin-top:0}
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:28px 18px;border:2px dashed color-mix(in srgb,var(--brand) 45%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,#fff);cursor:pointer;color:var(--muted);font-size:15px}
.drop b{color:var(--brand);font-size:17px}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.how{padding:28px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;position:relative;padding:0 0 22px 52px}
.how li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800}
.how li b{display:block;font-size:17px}
.how li span{font-size:15px;color:var(--muted)}

/* classes */
.cl{display:grid;grid-template-columns:1.35fr .85fr;gap:30px;align-items:start}
.cl-days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cl-list{padding:6px 24px}
.cl-row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:16px;padding:18px 0;border-bottom:1px dashed var(--line)}
.cl-row:last-child{border-bottom:0}
.cl-row.nt{grid-template-columns:1fr auto}.cl-row.nt time{display:none}
.cl-row time{font-weight:800;color:var(--brand)}
.cl-row h4{margin:0;font:700 18px/1.2 inherit}
.cl-row p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.cl-row button{font:700 14px/1 system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;white-space:nowrap}
.cl-row button[aria-pressed=true]{background:var(--brand);color:#fff}
.cl-day[hidden]{display:none}
.trial{position:sticky;top:110px;padding:26px}
.trial h3{margin:0 0 6px;font-size:24px}
.trial .pick{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 20%,#fff);font-weight:700;font-size:15px}

@media (max-width:900px){
  .fx{padding:72px 0}.fx h2,.fx h3,.fx h4,.fx dd{color:var(--ink)}
.fx .fxw{padding:0 20px}
  .ord,.bk,.qt,.cl{grid-template-columns:1fr}
  .bag,.sum,.trial{position:static}
  .ord-list,.cl-list{padding:4px 18px}.bk-main,.qt-main{padding:22px 18px 24px}
  .days{grid-template-columns:repeat(4,1fr)}
  .cl-row{grid-template-columns:1fr auto}.cl-row time{grid-column:1/-1;margin-bottom:-8px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}

(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
