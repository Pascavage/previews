<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | Frangelli&#39;s Bakery</title>
<meta name="description" content="A South Philly corner bakery since 1947. Every doughnut is hand cut and filled to order with jelly, Italian cream or custard, plus cakes, cookies and the famous Franolli.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#B8325A">
<link rel="preload" href="fonts/shrikhand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--paper:#FFF3F1;--ink:#2A1B17;--muted:#6E5550;--line:#F0D5CF;--brand:#B8325A;--accent:#F6C3CF;--accent-ink:#2A1B17}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Shrikhand';src:url(fonts/shrikhand-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans-latin-wght-normal.woff2) format('woff2');font-weight:100 1000;font-display:swap}
body{background:var(--paper);color:var(--ink);font:400 18px/1.6 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.disp{font-family:'Shrikhand',Georgia,serif;font-weight:400;letter-spacing:.005em}
h1,h2,h3{margin:0;line-height:1.02}
h2{font-family:'Shrikhand',Georgia,serif;font-weight:400;font-size:clamp(40px,5.4vw,70px);color:var(--brand)}
.kicker{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:4px}
.check{height:22px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--paper) 0 50%) 0 0/22px 22px}

/* header */
.site-head{position:sticky;top:0;z-index:20;background:var(--paper);transition:box-shadow .3s}
.site-head.scrolled{box-shadow:0 8px 24px -16px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:80px;gap:24px}
.logo{font-family:'Shrikhand',Georgia,serif;font-size:30px;text-decoration:none;color:var(--brand);text-shadow:2px 2px 0 var(--accent)}
.site-head nav{display:flex;gap:28px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.site-head nav a{text-decoration:none}.site-head nav a:hover{color:var(--brand)}
.phi{width:1em;height:1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 16px/1 'DM Sans',sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:18px 26px;border-radius:999px;text-decoration:none;border:3px solid var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn.main{background:var(--brand);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.btn.alt{background:var(--accent);color:var(--accent-ink);box-shadow:4px 4px 0 var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn.small{padding:12px 18px;font-size:14px}

/* hero */
.hero{position:relative;overflow:hidden;padding:56px 0 90px;background:var(--paper)}
.hero::before{content:"";position:absolute;right:-20%;top:50%;width:1400px;height:1400px;transform:translateY(-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 38%,var(--paper)) 0 6deg,transparent 6deg 12deg);border-radius:50%;opacity:.7;animation:turn 120s linear infinite}
@keyframes turn{to{transform:translateY(-50%) rotate(360deg)}}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.hero h1{font-family:'Shrikhand',Georgia,serif;font-weight:400;font-size:clamp(52px,7.4vw,108px);line-height:.98;color:var(--brand);text-shadow:4px 4px 0 var(--accent),8px 8px 0 var(--ink);margin:22px 0 28px}
.hero .lead{font-size:20px;max-width:29em;margin:0 0 34px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:16px}
.plate{position:relative;justify-self:center;width:min(460px,100%);aspect-ratio:1}
.plate .ph{position:absolute;inset:0;border-radius:50%;border:10px solid var(--ink);background:var(--brand) var(--img,none) center/cover no-repeat;box-shadow:0 0 0 14px var(--paper),0 0 0 20px var(--brand),18px 22px 0 20px var(--ink)}
.plate .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:'Shrikhand',serif;font-size:120px;color:var(--paper)}
.badge{position:absolute;display:grid;place-items:center;text-align:center;border-radius:50%;border:3px solid var(--ink);font-weight:800;line-height:1.05;text-transform:uppercase;letter-spacing:.06em}
.badge.since{left:-26px;top:10px;width:132px;height:132px;background:var(--accent);color:var(--accent-ink);transform:rotate(-12deg);font-size:13px}
.badge.since b{display:block;font-family:'Shrikhand',serif;font-size:34px;letter-spacing:0;text-transform:none;font-weight:400}
.badge.stars{right:-14px;bottom:18px;width:120px;height:120px;background:var(--paper);color:var(--ink);transform:rotate(10deg);font-size:12px}
.badge.stars b{display:block;font-family:'Shrikhand',serif;font-size:32px;color:var(--brand);font-weight:400;letter-spacing:0}

/* proof strip */
.strip{background:var(--brand);color:#fff;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.strip ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(3,1fr)}
.strip li{padding:22px 26px;text-align:center}
.strip li+li{border-left:2px dashed rgba(255,255,255,.4)}
.strip b{display:block;font-family:'Shrikhand',serif;font-weight:400;font-size:26px;color:var(--accent)}
.strip span{font-size:15px;font-weight:600;opacity:.9}

section.band{padding:110px 0}
.center{text-align:center}.center p.sub{max-width:34em;margin:18px auto 0;font-weight:500}

/* menu board */
.board{margin-top:54px;background:var(--ink);color:var(--paper);border-radius:28px;padding:56px 60px;border:10px solid color-mix(in srgb,var(--ink) 70%,var(--accent));box-shadow:12px 12px 0 var(--brand);position:relative}
.board::before{content:attr(data-title);position:absolute;top:-24px;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--accent);color:var(--accent-ink);font-family:'Shrikhand',serif;font-size:26px;padding:6px 26px;border-radius:999px;border:3px solid var(--ink);white-space:nowrap}
.board ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:64px}
.board li{padding:20px 0;border-bottom:2px dotted rgba(255,255,255,.22)}
.board h3{display:flex;align-items:baseline;gap:12px;font-size:23px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.board h3 .dots{flex:1;border-bottom:3px dotted color-mix(in srgb,var(--accent) 70%,transparent);transform:translateY(-6px)}
.board h3 .pr{font-family:'Shrikhand',serif;font-weight:400;color:var(--accent);font-size:24px;text-transform:none}
.board p{margin:6px 0 0;opacity:.78;font-size:16.5px}

/* tickets */
.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:56px}
.ticket{background:#fff;color:var(--ink);padding:30px 28px 34px;position:relative;box-shadow:0 18px 30px -18px rgba(0,0,0,.4);font-size:17px}
.ticket:nth-child(1){transform:rotate(-2deg)}.ticket:nth-child(2){transform:rotate(1.4deg) translateY(16px)}.ticket:nth-child(3){transform:rotate(-1deg)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:radial-gradient(circle at 8px 0,transparent 8px,#fff 8.5px) 0 0/16px 12px repeat-x}
.ticket .tno{display:flex;justify-content:space-between;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:16px}
.ticket .st{color:var(--brand);letter-spacing:2px}
.ticket p{margin:0;font-weight:500}
.ticket .who{margin-top:14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--brand)}

/* visit */
.visit{background:color-mix(in srgb,var(--accent) 22%,var(--paper));border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.addr{font-family:'Shrikhand',serif;font-size:clamp(34px,4vw,52px);line-height:1.05;color:var(--brand);margin:18px 0}
.sign{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:34px 36px;box-shadow:10px 10px 0 var(--ink)}
.sign .disp{font-size:30px;color:var(--brand);text-align:center;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:17px}
.hours td{padding:12px 0;border-bottom:2px dotted var(--line);font-weight:600}.hours td:last-child{text-align:right;font-weight:800}
.about{margin-top:26px;font-weight:500}

/* request */
.req{display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:start}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font-family:'Shrikhand',serif;font-size:34px;color:var(--brand);text-decoration:none;margin-top:16px}
.req form{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:32px;box-shadow:8px 8px 0 var(--accent)}
form input,form textarea,form select{border-width:2px}
form .btn{width:100%}

.foot{background:var(--ink);color:var(--paper);padding:44px 0 56px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:15px;opacity:.95}
.foot .logo{color:var(--accent);text-shadow:none;font-size:26px}
.callbar{display:none}

@media (max-width:900px){
  body{font-size:17px}
  .site-head nav{display:none}.bar .btn{display:none}
  .hero{padding:26px 0 70px}
  .hero .wrap,.visit .wrap,.req{grid-template-columns:1fr;gap:48px}
  .hero h1{text-shadow:3px 3px 0 var(--accent),6px 6px 0 var(--ink)}
  .plate{width:min(330px,82%)}
  .badge.since{left:-14px;width:104px;height:104px;font-size:11px}.badge.since b{font-size:26px}
  .badge.stars{right:-10px;width:96px;height:96px;font-size:10px}.badge.stars b{font-size:24px}
  .strip ul,.board ul,.tickets{grid-template-columns:1fr}
  .strip li+li{border-left:0;border-top:2px dashed rgba(255,255,255,.4)}
  .board{padding:46px 24px 30px;border-width:7px}
  .board::before{font-size:20px}
  .ticket:nth-child(n){transform:none}
  section.band{padding:76px 0}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1}
  .foot{padding-bottom:110px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Bakery","name":"Frangelli's Bakery","telephone":"215-271-7878","address":"847 W Ritner St, Philadelphia, PA 19148","email":"john@frangellis.com"}</script>
</head>
<body>
<div class="demo">Concept homepage for Frangelli&#39;s Bakery, made by a Royersford designer. Not live and not affiliated with the business.</div>

<header class="site-head" id="head"><div class="wrap bar"><a class="logo" href="index.html">Frangelli&#39;s</a></div><div class="check"></div></header>
<section class="hero"><div class="wrap" style="display:block;max-width:820px">
  <h1>Thanks!</h1>
  <p class="lead">We got your note and will get back to you soon. In a hurry? Call <a href="tel:+12152717878">215-271-7878</a>.</p>
  <a class="btn alt" href="index.html">Back to the home page</a>
</div></section>
<script>
(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
  else els.forEach(el => el.classList.add('on'));
})();
</script>
</body>
</html>
