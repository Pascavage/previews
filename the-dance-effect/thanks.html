<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | The Dance Effect Performing Arts Center</title>
<meta name="description" content="Dance classes in Spring City for ages 2 and up. Try a 10-week Discovery session, commit to the year-long Academy, or bring Move &amp; Groove to your school, with a stage performance for every dancer.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8A25D6">
<link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--paper:#FFFFFF;--ink:#1F1233;--muted:#5F5470;--line:#ECE6F3;--brand:#8A25D6;--accent:#C3E842;--accent-ink:#1F1233}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Bricolage';src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans-latin-wght-normal.woff2) format('woff2');font-weight:100 1000;font-display:swap}
:root{--c1:#FF5FB8;--c2:#A62BE6;--c3:#C3E842}
body{background:var(--paper);color:var(--ink);font:400 17.5px/1.65 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:'Bricolage',system-ui,sans-serif;margin:0;letter-spacing:-.025em;line-height:1.02;font-weight:700}
h2{font-size:clamp(38px,4.8vw,62px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.mark{display:inline-flex;gap:2px;align-items:center}
.tri{display:block;flex:none}
.phi{width:1em;height:1em}

/* header */
.site-head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:box-shadow .3s}
.site-head.scrolled{box-shadow:0 1px 0 var(--line),0 12px 30px -24px rgba(30,10,60,.35)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:82px;gap:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand b{display:block;font-family:'Bricolage',sans-serif;font-size:23px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.site-head nav{display:flex;gap:30px;font-weight:600;font-size:15px}
.site-head nav a{text-decoration:none;opacity:.75}.site-head nav a:hover{opacity:1;color:var(--brand)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1 'DM Sans',sans-serif;padding:17px 26px;border-radius:14px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn.main{background:var(--brand);color:#fff;box-shadow:0 14px 28px -14px color-mix(in srgb,var(--brand) 85%,transparent)}
.btn.main:hover{transform:translateY(-2px);box-shadow:0 18px 32px -14px color-mix(in srgb,var(--brand) 85%,transparent)}
.btn.lime{background:var(--c3);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.small{padding:13px 18px;font-size:15px;border-radius:12px}

/* hero */
.hero{position:relative;padding:56px 0 96px;overflow:hidden}
.confetti .tri{position:absolute;animation:drift 7s ease-in-out infinite;opacity:.95}
@keyframes drift{50%{translate:0 -10px}}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 10px;font-size:14px;font-weight:600;box-shadow:0 8px 20px -14px rgba(30,10,60,.3)}
.hero h1{font-size:clamp(50px,6.6vw,92px);margin:26px 0 24px}
.hero h1 .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c3) 85%,transparent) 62% 92%,transparent 92%);padding:0 .06em}
.hero .lead{font-size:19.5px;color:var(--muted);max-width:30em;margin:0 0 34px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.trust{display:flex;align-items:center;gap:14px;margin-top:34px;font-size:15px;color:var(--muted)}
.trust b{font-family:'Bricolage',sans-serif;font-size:30px;color:var(--ink);letter-spacing:-.02em}
.trust .st{color:var(--c2);letter-spacing:2px;display:block;font-size:15px}
.stage{position:relative;padding:28px}
.stage .big{position:absolute;right:-30px;top:-36px;width:300px;height:300px;z-index:0}
.stage .big2{position:absolute;left:-26px;bottom:-30px;width:160px;height:160px;z-index:0}
.photo{position:relative;z-index:1;aspect-ratio:4/4.6;border-radius:30px;background:var(--brand) var(--img,none) center/cover no-repeat;box-shadow:0 40px 80px -40px rgba(30,10,60,.6)}
.float{position:absolute;z-index:2;background:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 24px 44px -20px rgba(30,10,60,.45);display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.3}
.float b{display:block;font-family:'Bricolage',sans-serif;font-size:18px;letter-spacing:-.01em}
.float.f1{left:-6px;bottom:64px}.float.f2{right:-4px;top:40px}

/* bunting */
.bunting{position:relative;height:74px;overflow:hidden}
.bunting::before{content:"";position:absolute;left:-2%;right:-2%;top:10px;height:40px;border-top:2px solid var(--line);border-radius:50%}
.bunting .flags{position:absolute;inset:0;display:flex;justify-content:space-around;padding:0 10px}
.bunting .tri{margin-top:var(--y);transform-origin:top center}

/* programs */
section.band{padding:110px 0;position:relative}
.head{max-width:720px;margin-bottom:56px}
.head p{color:var(--muted);margin:16px 0 0;font-size:18.5px}
.programs{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.prog{position:relative;background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px 32px 32px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.prog:hover{transform:translateY(-4px);box-shadow:0 30px 60px -36px rgba(30,10,60,.45)}
.prog::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--pc)}
.prog .corner{position:absolute;right:-18px;top:-18px;opacity:.14}
.prog .age{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--pc) 22%,#fff);color:var(--ink);padding:6px 12px;border-radius:999px}
.prog h3{font-size:32px;margin:20px 0 6px}
.prog .kind{color:var(--muted);margin:0 0 22px;font-weight:500}
.prog ul{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:12px}
.prog li{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:start;font-size:16.5px}
.prog li .tri{margin-top:4px}
.prog .btn{margin-top:auto;align-self:flex-start}

/* stats */
.stats{background:var(--brand);color:#fff;position:relative;overflow:hidden}
.stats ul{list-style:none;margin:0 auto;padding:64px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stats li{padding:0 10px}
.stats b{display:block;font-family:'Bricolage',sans-serif;font-size:clamp(44px,5vw,66px);letter-spacing:-.03em;line-height:1}
.stats span{display:block;margin-top:10px;opacity:.85;font-weight:500}
.stats .tri{position:absolute;opacity:.25}

/* extras */
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:10px}
.extra{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:26px;border-radius:22px;background:color-mix(in srgb,var(--brand) 5%,var(--paper))}
.extra h3{font-size:23px;margin:2px 0 6px}.extra p{margin:0;color:var(--muted);font-size:16.5px}

/* reviews */
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.rev{position:relative;background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px 30px 28px}
.rev .tri{position:absolute;left:28px;top:-16px}
.rev p{margin:6px 0 20px;font-size:18.5px;line-height:1.55;font-weight:500}
.rev span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.rev .st{color:var(--c2);letter-spacing:2px;font-size:14px;display:block;margin-bottom:6px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;counter-reset:s}
.step{counter-increment:s}
.step .n{position:relative;width:74px;height:74px;margin-bottom:22px}
.step .n .tri{position:absolute;inset:0;width:74px;height:74px}
.step .n::after{content:counter(s);position:absolute;left:21px;top:19px;font-family:'Bricolage',sans-serif;font-size:28px;font-weight:700;color:#fff}
.step h3{font-size:26px;margin-bottom:8px}.step p{margin:0;color:var(--muted)}

/* visit + request */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:40px}
.addr{font-family:'Bricolage',sans-serif;font-size:clamp(32px,3.6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:16px 0}
.hours{width:100%;border-collapse:collapse;font-size:16.5px}
.hours td{padding:13px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:right;font-weight:700}
.about{color:var(--muted);margin:0 0 26px}
.req{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start;margin-top:28px}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font-family:'Bricolage',sans-serif;font-size:30px;font-weight:700;text-decoration:none;margin-top:14px;letter-spacing:-.02em}
form input,form textarea,form select{border-radius:12px}
form .btn{width:100%}

/* cta */
.cta{position:relative;margin:0 28px;border-radius:36px;background:var(--ink);color:#fff;overflow:hidden;text-align:center;padding:96px 28px}
.cta h2{font-size:clamp(40px,5.6vw,76px)}
.cta p{opacity:.8;max-width:34em;margin:18px auto 34px;font-size:18.5px}
.cta .actions{justify-content:center}
.cta .tri{position:absolute}

.foot{padding:56px 0 64px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;color:var(--muted);font-size:15px}
.callbar{display:none}

@media (max-width:960px){
  body{font-size:17px}
  .site-head nav,.bar>.btn{display:none}
  .hero{padding:26px 0 70px}
  .hero .wrap,.visit,.req{grid-template-columns:1fr;gap:44px}
  .stage{max-width:440px;margin:0 auto;width:100%}
  .stage .big{width:200px;height:200px;right:-10px}
  .float.f2{right:0;top:12px}
  .programs,.extras,.reviews,.steps{grid-template-columns:1fr}
  .stats ul{grid-template-columns:1fr 1fr;row-gap:40px;padding:56px 28px}
  section.band{padding:76px 0}
  .card{padding:28px 22px}
  .cta{margin:0 14px;padding:70px 22px;border-radius:28px}
  .confetti .tri:nth-child(n+7){display:none}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1}
  .foot{padding-bottom:110px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"LocalBusiness","name":"The Dance Effect Performing Arts Center","telephone":"484-369-8193","address":"3563 Schuylkill Rd, Unit 3, Spring City, PA 19475","email":"Hello@TheDanceEffectPAC.com"}</script>
</head>

<section class="hero"><div class="wrap" style="display:block;max-width:820px">
  <h1>Thank you!</h1>
  <p class="lead">We have your note and will be in touch soon. You can also call <a href="tel:+14843698193">484-369-8193</a>.</p>
  <a class="btn ghost" href="index.html">Back to the home page</a>
</div></section>
<script>
(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
  else els.forEach(el => el.classList.add('on'));
})();
</script>

</html>
