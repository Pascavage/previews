<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | Jefferis Family Farm Market</title>
<meta name="description" content="A West Bradford family farm market on Lincoln Highway. Local plants, produce, meats, sweets and dairy, plus Angus beef raised on our own farm.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3D5A1E">
<link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/caveat-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--paper:#F5F1E6;--ink:#1D2116;--muted:#5F6455;--line:#DED8C4;--brand:#3D5A1E;--accent:#E8B23A;--accent-ink:#1D2116}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'BC';src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'BC';src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Barlow';src:url(fonts/barlow-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Barlow';src:url(fonts/barlow-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Caveat';src:url(fonts/caveat-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--r-card:6px;--r-btn:4px;--r-in:4px}
body{background:var(--paper);color:var(--ink);font:400 18px/1.6 'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--ink) 4%,transparent) 31px 32px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:'BC',sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;margin:0;letter-spacing:.005em}
h2{font-size:clamp(46px,6vw,84px)}
.fx h2{font-size:clamp(40px,5vw,64px)}
.hand{font-family:'Caveat',cursive;font-weight:600;text-transform:none;letter-spacing:0}
.lbl{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 'BC',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
.lbl::before,.lbl::after{content:"";width:22px;height:2px;background:currentColor}

/* top ribbon + header */
.ribbon{background:var(--ink);color:var(--paper);font:600 15px/1 'BC',sans-serif;letter-spacing:.16em;text-transform:uppercase}
.ribbon .wrap{display:flex;justify-content:space-between;gap:16px;padding-top:11px;padding-bottom:11px}
.ribbon a{text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.site-head{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:3px double color-mix(in srgb,var(--ink) 35%,transparent);transition:box-shadow .3s}
.site-head.scrolled{box-shadow:0 10px 24px -18px rgba(0,0,0,.5)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:84px}
.badge{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.badge .oval{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;font:800 22px/1 'BC',sans-serif;box-shadow:inset 0 0 0 3px var(--brand),inset 0 0 0 5px #fff}
.badge b{font:800 28px/.9 'BC',sans-serif;text-transform:uppercase;display:block}
.badge small{display:block;font:600 13px/1 'BC',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.site-head nav{display:flex;gap:30px;font:600 17px/1 'BC',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.site-head nav a{text-decoration:none}.site-head nav a:hover{color:var(--brand)}
.phi{width:1em;height:1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 19px/1 'BC',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:18px 28px;border-radius:4px;text-decoration:none;border:2px solid var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:5px 5px 0 var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px)}.btn.main:hover{box-shadow:7px 7px 0 var(--ink)}

/* hero */
.hero{padding:70px 0 100px;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.hero h1{font-size:clamp(64px,9vw,138px);margin:22px 0 26px}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:-4px;right:-4px;bottom:.06em;height:.16em;background:var(--accent);z-index:-1;transform:rotate(-1deg)}
.hero .lead{font-size:20px;max-width:30em;margin:0 0 34px;color:color-mix(in srgb,var(--ink) 85%,var(--paper))}
.actions{display:flex;flex-wrap:wrap;gap:16px}
.tagwrap{position:relative;justify-self:center;width:min(440px,100%);padding-top:44px}
.tagwrap::before{content:"";position:absolute;left:50%;top:0;width:2px;height:62px;background:var(--ink);transform:rotate(8deg);transform-origin:top}
.tag{position:relative;background:#fff;padding:18px 18px 22px;border-radius:6px 6px 14px 14px;box-shadow:0 30px 60px -30px rgba(0,0,0,.55);transform:rotate(3deg)}
.tag::before{content:"";position:absolute;left:50%;top:-11px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.tag .ph{aspect-ratio:4/4.4;border-radius:3px;background:var(--brand) var(--img,none) center/cover no-repeat;display:grid;place-items:center;color:#fff;font:800 110px/1 'BC',sans-serif}
.tag .cap{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font:800 22px/1 'BC',sans-serif;text-transform:uppercase}
.tag .cap span{font:600 14px/1 'BC',sans-serif;letter-spacing:.18em;color:var(--muted)}
.note{position:absolute;left:-40px;bottom:40px;background:var(--accent);color:var(--accent-ink);padding:14px 20px;transform:rotate(-6deg);font:600 28px/1.05 'Caveat',cursive;box-shadow:0 14px 26px -16px rgba(0,0,0,.6);max-width:200px}
.note b{display:block;font:800 40px/1 'BC',sans-serif}

/* tickets */
.tix{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:-30px;position:relative;z-index:2}
.tix li{list-style:none;background:var(--ink);color:var(--paper);padding:24px 26px;position:relative;-webkit-mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.tix b{display:block;font:800 34px/1 'BC',sans-serif;text-transform:uppercase;color:var(--accent)}
.tix span{font-size:15px;opacity:.85}
.tix ul{margin:0;padding:0;display:contents}

section.band{padding:110px 0}
.headrow{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:48px}
.headrow p{max-width:28em;margin:0;color:var(--muted)}

/* the case */
.case{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.case li{list-style:none;background:#fff;border:2px dashed color-mix(in srgb,var(--ink) 28%,transparent);border-radius:6px;padding:28px 26px 26px;position:relative}
.case li:nth-child(3n+2){transform:translateY(18px)}
.case .ic{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--brand) 12%,#fff);color:var(--brand);margin-bottom:16px}
.case h3{font-size:30px}
.case p{margin:8px 0 0;font-size:16.5px;color:var(--muted)}
.case .no{position:absolute;right:18px;top:16px;font:600 14px/1 'BC',sans-serif;letter-spacing:.18em;color:color-mix(in srgb,var(--ink) 35%,transparent)}

/* chalkboard */
.chalk{background:color-mix(in srgb,var(--ink) 92%,var(--brand));color:#f4f1ea;padding:110px 0;position:relative;overflow:hidden}
.chalk::before{content:"";position:absolute;inset:18px;border:3px solid color-mix(in srgb,#fff 18%,transparent);border-radius:6px;pointer-events:none}
.chalk h2{color:#fff}
.chalk .lbl{color:var(--accent)}
.boards{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:46px}
.boards blockquote{margin:0}
.boards p{font:600 31px/1.18 'Caveat',cursive;margin:0}
.boards footer{margin-top:14px;font:600 14px/1 'BC',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.boards blockquote:nth-child(2){transform:rotate(-1.5deg)}

/* visit */
.visit .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:start}
.addr{font:800 clamp(44px,5vw,70px)/.95 'BC',sans-serif;text-transform:uppercase;margin:18px 0 16px}
.addr span{color:var(--brand)}
.visit .note2{color:var(--muted);margin:0 0 26px}
.sign{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:30px 32px;box-shadow:8px 8px 0 var(--brand);position:relative}
.sign::before,.sign::after{content:"";position:absolute;top:-34px;width:2px;height:34px;background:var(--ink)}
.sign::before{left:24%}.sign::after{right:24%}
.sign h3{font-size:34px;text-align:center;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:17px}
.hours td{padding:11px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:right;font-weight:600}
.about{margin-top:30px;padding-top:26px;border-top:2px solid var(--ink)}
.about p{margin:10px 0 0}

/* request */
.req{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font:800 40px/1 'BC',sans-serif;color:var(--brand);text-decoration:none;margin-top:20px}
.req form{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:32px;box-shadow:8px 8px 0 var(--accent)}
form .btn{width:100%}

.foot{background:var(--ink);color:var(--paper);padding:46px 0 58px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;font-size:15px}
.foot .badge b{color:#fff}.foot .badge small{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.callbar{display:none}

@media (max-width:900px){
  body{font-size:17px}
  .ribbon .wrap span:last-child{display:none}
  .site-head nav{display:none}.bar>.btn{display:none}
  .hero{padding:34px 0 80px}
  .hero .wrap,.visit .wrap,.req{grid-template-columns:1fr;gap:56px}
  .tagwrap{width:min(330px,88%)}
  .note{left:-14px;bottom:24px;font-size:23px;padding:10px 14px}.note b{font-size:32px}
  .tix,.case,.boards{grid-template-columns:1fr}
  .tix{margin-top:0}
  .case li:nth-child(3n+2){transform:none}
  section.band,.chalk{padding:76px 0}
  .req form{padding:24px 18px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1}
  .foot{padding-bottom:110px}
}
.fx{color:var(--ink);padding:100px 0;background:color-mix(in srgb,var(--brand) 7%,var(--paper));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fx h2,.fx h3,.fx h4,.fx dd{color:var(--ink)}
.fx .fxw{max-width:1180px;margin:0 auto;padding:0 28px}
.fx-top{display:flex;justify-content:space-between;align-items:end;gap:28px;flex-wrap:wrap;margin-bottom:40px}
.fx-top p{margin:12px 0 0;max-width:34em;color:var(--muted)}
.fx-eye{display:inline-flex;align-items:center;gap:8px;font:800 12px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.fx-eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.fx-pill{font:700 13px/1 system-ui,sans-serif;padding:10px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.fx-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card,18px);box-shadow:0 24px 50px -36px rgba(0,0,0,.45)}
.fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font:800 16px/1 system-ui,sans-serif;padding:17px 20px;border-radius:var(--r-btn,12px);border:0;background:var(--brand);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}
.fx-btn:hover{transform:translateY(-1px)}.fx-btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.fx-note{margin:12px 0 0;font-size:14px;color:var(--muted);text-align:center}
.fx-done{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,#fff);font-size:15px;line-height:1.45}
.fx-done.on{display:block}
.fx label.l{display:block;font:700 13px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.fx input.t,.fx select.t,.fx textarea.t{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.fx textarea.t{min-height:90px;resize:vertical}
.fx .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 15px/1.2 system-ui,sans-serif;padding:11px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

/* order */
.ord{display:grid;grid-template-columns:1.35fr .9fr;gap:30px;align-items:start}
.ord-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ord-list{padding:8px 26px}
.ord-item{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px dashed var(--line)}
.ord-item:last-child{border-bottom:0}
.ord-item h4{margin:0;font:700 18px/1.25 inherit}
.ord-item p{margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:700 20px/1 system-ui;color:var(--ink);cursor:pointer}
.qty button.add{background:var(--brand);border-color:var(--brand);color:#fff}
.qty output{min-width:22px;text-align:center;font-weight:800}
.ord-grp[hidden]{display:none}
.bag{position:sticky;top:110px;padding:26px}
.bag h3{margin:0 0 6px;font-size:24px}
.bag ul{list-style:none;margin:14px 0 0;padding:0;max-height:220px;overflow:auto}
.bag li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.bag li b{color:var(--brand)}
.bag .empty{color:var(--muted);font-size:15px;padding:14px 0;border:0}

/* book */
.bk{display:grid;grid-template-columns:1.3fr .8fr;gap:30px;align-items:start}
.bk-main{padding:28px 30px 32px}
.bk-main label.l:first-child{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 13px/1.1 system-ui,sans-serif;color:var(--muted)}
.day b{font-size:20px;color:var(--ink)}
.day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}.day[aria-pressed=true] b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 15px/1 system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.slot[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sum{position:sticky;top:110px;padding:26px}
.sum h3{margin:0 0 14px;font-size:24px}
.sum dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15.5px}
.sum dt{color:var(--muted);font-weight:600}.sum dd{margin:0;font-weight:700;text-align:right}

/* quote */
.qt{display:grid;grid-template-columns:1.25fr .85fr;gap:30px;align-items:start}
.qt-main{padding:28px 30px 32px}
.qt-main label.l:first-child{margin-top:0}
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:28px 18px;border:2px dashed color-mix(in srgb,var(--brand) 45%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,#fff);cursor:pointer;color:var(--muted);font-size:15px}
.drop b{color:var(--brand);font-size:17px}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.how{padding:28px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;position:relative;padding:0 0 22px 52px}
.how li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800}
.how li b{display:block;font-size:17px}
.how li span{font-size:15px;color:var(--muted)}

/* classes */
.cl{display:grid;grid-template-columns:1.35fr .85fr;gap:30px;align-items:start}
.cl-days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cl-list{padding:6px 24px}
.cl-row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:16px;padding:18px 0;border-bottom:1px dashed var(--line)}
.cl-row:last-child{border-bottom:0}
.cl-row.nt{grid-template-columns:1fr auto}.cl-row.nt time{display:none}
.cl-row time{font-weight:800;color:var(--brand)}
.cl-row h4{margin:0;font:700 18px/1.2 inherit}
.cl-row p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.cl-row button{font:700 14px/1 system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;white-space:nowrap}
.cl-row button[aria-pressed=true]{background:var(--brand);color:#fff}
.cl-day[hidden]{display:none}
.trial{position:sticky;top:110px;padding:26px}
.trial h3{margin:0 0 6px;font-size:24px}
.trial .pick{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 20%,#fff);font-weight:700;font-size:15px}

@media (max-width:900px){
  .fx{padding:72px 0}.fx h2,.fx h3,.fx h4,.fx dd{color:var(--ink)}
.fx .fxw{padding:0 20px}
  .ord,.bk,.qt,.cl{grid-template-columns:1fr}
  .bag,.sum,.trial{position:static}
  .ord-list,.cl-list{padding:4px 18px}.bk-main,.qt-main{padding:22px 18px 24px}
  .days{grid-template-columns:repeat(4,1fr)}
  .cl-row{grid-template-columns:1fr auto}.cl-row time{grid-column:1/-1;margin-bottom:-8px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
</style>

(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
