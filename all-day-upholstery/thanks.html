<style>
:root{--paper:#F3F2EE;--ink:#1A1C1E;--muted:#5C6064;--line:#DCDAD3;--brand:#24476B;--accent:#E07A3F;--accent-ink:#1A1C1E}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-full-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-full-italic.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'BC';src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Barlow';src:url(fonts/barlow-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Barlow';src:url(fonts/barlow-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--r-card:14px;--r-btn:999px;--r-in:10px;--stitch:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 18px)}
body{background:var(--paper);color:var(--ink);font:400 18px/1.62 'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:560;font-variation-settings:'opsz' 120;line-height:1.02;margin:0;letter-spacing:-.015em}
h1 em,h2 em{font-style:italic;font-weight:400;color:var(--brand)}
h2{font-size:clamp(40px,5.2vw,68px)}
.fx h2{font-size:clamp(36px,4.4vw,56px)}
.cap{font:600 14px/1 'BC',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}

.site-head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);transition:box-shadow .3s}
.site-head.scrolled{box-shadow:0 1px 0 var(--line),0 12px 24px -20px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:82px}
.mark{text-decoration:none;display:flex;align-items:baseline;gap:12px}
.mark b{font:italic 500 30px/1 'Fraunces',serif}
.mark small{font:600 13px/1 'BC',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.site-head nav{display:flex;gap:30px;font:600 16px/1 'BC',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.site-head nav a{text-decoration:none}.site-head nav a:hover{color:var(--brand)}
.phi{width:1em;height:1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 17px/1 'BC',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:18px 28px;border-radius:999px;text-decoration:none;border:1.5px solid var(--ink);cursor:pointer;transition:transform .15s,background .15s}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.line{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}

/* hero */
.hero{padding:56px 0 90px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.hero h1{font-size:clamp(54px,7.4vw,108px);margin:20px 0 26px}
.hero .lead{font-size:20px;max-width:30em;margin:0 0 34px;color:color-mix(in srgb,var(--ink) 82%,var(--paper))}
.actions{display:flex;flex-wrap:wrap;gap:14px}
.frame{position:relative;justify-self:center;width:min(470px,100%)}
.frame .ph{aspect-ratio:4/4.8;border-radius:22px;background:var(--brand) var(--img,none) center/cover no-repeat;display:grid;place-items:center;color:#fff;font:italic 400 120px/1 'Fraunces',serif;box-shadow:0 34px 60px -34px rgba(0,0,0,.6)}
.frame .ph::after{content:"";position:absolute;inset:12px;border:2px dashed color-mix(in srgb,#fff 80%,transparent);border-radius:14px;pointer-events:none}
.ticket{position:absolute;right:-30px;top:40px;width:150px;background:var(--accent);color:var(--accent-ink);padding:30px 18px 18px;border-radius:8px 8px 8px 8px;transform:rotate(7deg);text-align:center;box-shadow:0 18px 30px -18px rgba(0,0,0,.6);clip-path:polygon(18% 0,82% 0,100% 14%,100% 100%,0 100%,0 14%)}
.ticket::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--paper)}
.ticket .cap{color:inherit;font-size:12px;display:block}
.ticket b{display:block;font:italic 500 46px/1 'Fraunces',serif;margin:8px 0 4px}
.ticket small{font-size:13px;font-weight:600}

/* tape */
.tape{height:46px;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 60px) 0 0/100% 20px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 12px) 0 0/100% 11px no-repeat,
  var(--accent);border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}

section.band{padding:110px 0}
.headrow{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:50px}
.headrow p{max-width:28em;margin:0;color:var(--muted)}

/* proof */
.proof{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.proof li{list-style:none;padding:34px 30px}
.proof li+li{border-left:1px solid var(--line)}
.proof b{display:block;font:italic 500 34px/1.1 'Fraunces',serif;color:var(--brand)}
.proof span{font-size:15.5px;color:var(--muted)}

/* bench */
.bench{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;padding:0;margin:0}
.bench li{list-style:none;display:grid;grid-template-columns:54px 1fr;gap:20px;padding:28px 0;position:relative}
.bench li::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--stitch);opacity:.9}
.bench .ic{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--ink);color:var(--brand)}
.bench h3{font-size:27px}
.bench p{margin:6px 0 0;color:var(--muted);font-size:16.5px}

/* tags */
.tags-sec{background:color-mix(in srgb,var(--brand) 92%,#000);color:#fff;padding:110px 0}
.tags-sec .cap{color:var(--accent)}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:50px}
.rtag{background:color-mix(in srgb,var(--accent) 18%,#f7efe2);color:var(--ink);padding:42px 28px 28px;border-radius:10px;position:relative;clip-path:polygon(12% 0,88% 0,100% 9%,100% 100%,0 100%,0 9%)}
.rtag::before{content:"";position:absolute;top:14px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:color-mix(in srgb,var(--brand) 92%,#000)}
.rtag::after{content:"";position:absolute;left:18px;right:18px;top:40px;height:2px;background:var(--stitch)}
.rtag p{margin:16px 0 0;font:italic 400 21px/1.42 'Fraunces',serif}
.rtag footer{margin-top:16px;font:600 13px/1 'BC',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.rtag:nth-child(1){transform:rotate(-2deg)}.rtag:nth-child(3){transform:rotate(1.5deg)}

/* visit */
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.addr{font:italic 400 clamp(40px,4.4vw,60px)/1.05 'Fraunces',serif;margin:18px 0 14px}
.visit .note2{color:var(--muted);margin:0 0 26px}
.card{background:#fff;border-radius:18px;padding:32px 34px;border:1px solid var(--line);position:relative}
.card::before{content:"";position:absolute;inset:10px;border:2px dashed color-mix(in srgb,var(--accent) 85%,transparent);border-radius:12px;pointer-events:none}
.hours{width:100%;border-collapse:collapse;font-size:17px;position:relative}
.hours td{padding:11px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:600}
.about{margin-top:30px}
.about p{margin:10px 0 0}

.req{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font:italic 500 38px/1 'Fraunces',serif;color:var(--brand);text-decoration:none;margin-top:20px}
.req form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px}
form .btn{width:100%}

.foot{border-top:1.5px solid var(--ink);padding:40px 0 56px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;font-size:15px;color:var(--muted)}
.callbar{display:none}

@media (max-width:900px){
  body{font-size:17px}
  .site-head nav{display:none}.bar>.btn{display:none}
  .mark small{display:none}
  .hero{padding:28px 0 70px}
  .hero .wrap,.visit .wrap,.req{grid-template-columns:1fr;gap:50px}
  .frame{width:min(340px,86%)}
  .ticket{right:-16px;top:24px;width:118px;padding:26px 12px 14px}.ticket b{font-size:36px}
  .proof,.bench,.tags{grid-template-columns:1fr}
  .proof li+li{border-left:0;border-top:1px solid var(--line)}
  .rtag:nth-child(n){transform:none}
  section.band,.tags-sec{padding:76px 0}
  .req form{padding:24px 18px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1;box-shadow:0 10px 28px rgba(0,0,0,.28)}
  .foot{padding-bottom:110px}
}
.fx{color:var(--ink);padding:100px 0;background:color-mix(in srgb,var(--brand) 7%,var(--paper));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fx h2,.fx h3,.fx h4,.fx dd{color:var(--ink)}
.fx .fxw{max-width:1180px;margin:0 auto;padding:0 28px}
.fx-top{display:flex;justify-content:space-between;align-items:end;gap:28px;flex-wrap:wrap;margin-bottom:40px}
.fx-top p{margin:12px 0 0;max-width:34em;color:var(--muted)}
.fx-eye{display:inline-flex;align-items:center;gap:8px;font:800 12px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.fx-eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.fx-pill{font:700 13px/1 system-ui,sans-serif;padding:10px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.fx-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card,18px);box-shadow:0 24px 50px -36px rgba(0,0,0,.45)}
.fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font:800 16px/1 system-ui,sans-serif;padding:17px 20px;border-radius:var(--r-btn,12px);border:0;background:var(--brand);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}
.fx-btn:hover{transform:translateY(-1px)}.fx-btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.fx-note{margin:12px 0 0;font-size:14px;color:var(--muted);text-align:center}
.fx-done{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,#fff);font-size:15px;line-height:1.45}
.fx-done.on{display:block}
.fx label.l{display:block;font:700 13px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.fx input.t,.fx select.t,.fx textarea.t{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.fx textarea.t{min-height:90px;resize:vertical}
.fx .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 15px/1.2 system-ui,sans-serif;padding:11px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

/* order */
.ord{display:grid;grid-template-columns:1.35fr .9fr;gap:30px;align-items:start}
.ord-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ord-list{padding:8px 26px}
.ord-item{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px dashed var(--line)}
.ord-item:last-child{border-bottom:0}
.ord-item h4{margin:0;font:700 18px/1.25 inherit}
.ord-item p{margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:700 20px/1 system-ui;color:var(--ink);cursor:pointer}
.qty button.add{background:var(--brand);border-color:var(--brand);color:#fff}
.qty output{min-width:22px;text-align:center;font-weight:800}
.ord-grp[hidden]{display:none}
.bag{position:sticky;top:110px;padding:26px}
.bag h3{margin:0 0 6px;font-size:24px}
.bag ul{list-style:none;margin:14px 0 0;padding:0;max-height:220px;overflow:auto}
.bag li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.bag li b{color:var(--brand)}
.bag .empty{color:var(--muted);font-size:15px;padding:14px 0;border:0}

/* book */
.bk{display:grid;grid-template-columns:1.3fr .8fr;gap:30px;align-items:start}
.bk-main{padding:28px 30px 32px}
.bk-main label.l:first-child{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 13px/1.1 system-ui,sans-serif;color:var(--muted)}
.day b{font-size:20px;color:var(--ink)}
.day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}.day[aria-pressed=true] b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 15px/1 system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.slot[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sum{position:sticky;top:110px;padding:26px}
.sum h3{margin:0 0 14px;font-size:24px}
.sum dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15.5px}
.sum dt{color:var(--muted);font-weight:600}.sum dd{margin:0;font-weight:700;text-align:right}

/* quote */
.qt{display:grid;grid-template-columns:1.25fr .85fr;gap:30px;align-items:start}
.qt-main{padding:28px 30px 32px}
.qt-main label.l:first-child{margin-top:0}
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:28px 18px;border:2px dashed color-mix(in srgb,var(--brand) 45%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--brand) 4%,#fff);cursor:pointer;color:var(--muted);font-size:15px}
.drop b{color:var(--brand);font-size:17px}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.how{padding:28px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;position:relative;padding:0 0 22px 52px}
.how li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800}
.how li b{display:block;font-size:17px}
.how li span{font-size:15px;color:var(--muted)}

/* classes */
.cl{display:grid;grid-template-columns:1.35fr .85fr;gap:30px;align-items:start}
.cl-days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cl-list{padding:6px 24px}
.cl-row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:16px;padding:18px 0;border-bottom:1px dashed var(--line)}
.cl-row:last-child{border-bottom:0}
.cl-row.nt{grid-template-columns:1fr auto}.cl-row.nt time{display:none}
.cl-row time{font-weight:800;color:var(--brand)}
.cl-row h4{margin:0;font:700 18px/1.2 inherit}
.cl-row p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.cl-row button{font:700 14px/1 system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;white-space:nowrap}
.cl-row button[aria-pressed=true]{background:var(--brand);color:#fff}
.cl-day[hidden]{display:none}
.trial{position:sticky;top:110px;padding:26px}
.trial h3{margin:0 0 6px;font-size:24px}
.trial .pick{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 20%,#fff);font-weight:700;font-size:15px}

@media (max-width:900px){
  .fx{padding:72px 0}.fx h2,.fx h3,.fx h4,.fx dd{color:var(--ink)}
.fx .fxw{padding:0 20px}
  .ord,.bk,.qt,.cl{grid-template-columns:1fr}
  .bag,.sum,.trial{position:static}
  .ord-list,.cl-list{padding:4px 18px}.bk-main,.qt-main{padding:22px 18px 24px}
  .days{grid-template-columns:repeat(4,1fr)}
  .cl-row{grid-template-columns:1fr auto}.cl-row time{grid-column:1/-1;margin-bottom:-8px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}

<header class="site-head" id="head"><div class="wrap bar"><a class="mark" href="index.html#top"><b>All Day Upholstery</b><small>Spring City</small></a></div></header>
<section class="hero"><div class="wrap" style="display:block;max-width:820px">
  <h1>Thank <em>you.</em></h1>
  <p class="lead">We have your note and will get back to you soon. In a hurry? Call <a href="tel:+16108884104">610-888-4104</a>.</p>
  <a class="btn line" href="index.html">Back to the home page</a>
</div></section>
<script>
(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
  else els.forEach(el => el.classList.add('on'));
})();
</script>
