<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | Lotus Hair Studio</title>
<meta name="description" content="Cuts, color and styling for the whole family in a cozy studio on North Lewis Road. Owner Heather and her team listen first, then make you feel great.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7A3B5E">
<link rel="preload" href="fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-full-italic.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--paper:#FBF5F6;--ink:#2A1A22;--muted:#6F5E66;--line:#EBDCE0;--brand:#7A3B5E;--accent:#F0A7B8;--accent-ink:#2A1A22}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-full-normal.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-full-italic.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
body{background:var(--paper);color:var(--ink);font:400 18px/1.6 'Fraunces',Georgia,serif;font-variation-settings:'opsz' 14,'SOFT' 50;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-weight:500;margin:0;letter-spacing:-.015em;line-height:1.02;font-variation-settings:'opsz' 144,'SOFT' 100}
h2{font-size:clamp(38px,5vw,64px)}
h2 em,h1 em{font-style:italic;color:var(--brand);font-weight:400}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* header */
.site-head{position:sticky;top:0;z-index:20;transition:background .3s,box-shadow .3s}
.site-head.scrolled{background:color-mix(in srgb,var(--paper) 78%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 1px 0 var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:78px;gap:24px}
.word{font-size:26px;font-style:italic;font-weight:500;text-decoration:none;letter-spacing:-.01em;font-variation-settings:'opsz' 72,'SOFT' 100}
.word span{color:var(--brand)}
.site-head nav{display:flex;gap:30px;font-size:16px}
.site-head nav a{text-decoration:none;opacity:.75}.site-head nav a:hover{opacity:1}
.tel{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:16px;border-bottom:1.5px solid var(--accent);padding-bottom:2px}
.phi{width:1em;height:1em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 16px/1 'Fraunces',serif;padding:17px 28px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.main{background:var(--brand);color:#fff}.btn.main:hover{background:color-mix(in srgb,var(--brand) 85%,#000)}
.btn.soft{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* hero */
.hero{padding:40px 0 90px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
.hero h1{font-size:clamp(50px,7vw,104px);margin:22px 0 26px}
.hero .lead{font-size:20px;color:var(--muted);max-width:30em;margin:0 0 34px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.rate{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.rate b{color:var(--ink);font-weight:600}.rate .st{color:var(--accent);letter-spacing:2px;font-size:15px}
.arch{position:relative;aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--brand) var(--img,none) center/cover no-repeat;box-shadow:0 40px 80px -40px color-mix(in srgb,var(--brand) 70%,transparent)}
.arch .ini{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:140px;font-style:italic;opacity:.25}
.figure{position:relative}
.stamp{position:absolute;left:-46px;bottom:56px;width:150px;height:150px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 16px 40px -16px rgba(0,0,0,.35)}
.stamp svg{position:absolute;inset:0;animation:spin 22s linear infinite}
.stamp text{font:600 11.5px 'Fraunces',serif;letter-spacing:.24em;text-transform:uppercase;fill:currentColor}
.stamp b{font-size:34px;font-weight:600;line-height:1;text-align:center}.stamp b small{display:block;font-size:11px;letter-spacing:.1em;font-weight:500;margin-top:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* proof row */
.proof{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.proof ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(3,1fr)}
.proof li{padding:26px 28px;display:flex;gap:14px;align-items:baseline}
.proof li+li{border-left:1px solid var(--line)}
.proof b{font-size:22px;font-weight:500;font-style:italic;font-variation-settings:'opsz' 72}
.proof span{color:var(--muted);font-size:15px}

section.band{padding:110px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:56px}
.head p{max-width:26em;color:var(--muted);margin:0}

/* menu-style services */
.menu{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:72px}
.menu li{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;padding:28px 0;border-top:1px solid var(--line)}
.menu .no{font-size:14px;color:var(--brand);font-weight:600;padding-top:8px;font-variant-numeric:tabular-nums}
.menu h3{font-size:28px;display:flex;align-items:baseline;gap:12px}
.menu h3 .dots{flex:1;border-bottom:1.5px dotted color-mix(in srgb,var(--ink) 30%,transparent);transform:translateY(-6px)}
.menu h3 .pr{font-size:20px;font-style:italic;color:var(--brand)}
.menu p{grid-column:2;margin:0;color:var(--muted);font-size:17px}

/* quote */
.quote{background:var(--brand);color:#fff;padding:120px 0;position:relative;overflow:hidden}
.quote blockquote{margin:0;max-width:980px}
.quote blockquote p{font-size:clamp(32px,4.4vw,58px);line-height:1.12;font-style:italic;font-weight:400;margin:0 0 28px;font-variation-settings:'opsz' 144,'SOFT' 100}
.quote blockquote p::before{content:"\201C";color:var(--accent);margin-right:.05em}
.quote footer{font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.quote .more{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:72px;border-top:1px solid rgba(255,255,255,.25);padding-top:40px}
.quote .more p{font-size:19px;margin:0 0 10px;font-style:italic}
.quote .more span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.quote .flower{position:absolute;right:-60px;top:-60px;width:320px;height:320px;opacity:.12;color:#fff}

/* steps */
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;counter-reset:s}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);font-size:22px;font-style:italic;margin-bottom:22px}
.steps h3{font-size:26px;margin-bottom:10px}.steps p{margin:0;color:var(--muted)}

/* visit */
.visit .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:72px;align-items:start}
.addr{font-size:clamp(34px,4vw,52px);font-weight:500;line-height:1.08;margin:18px 0 18px;font-variation-settings:'opsz' 144}
.visit .note{color:var(--muted);margin:0 0 30px}
.hours{width:100%;border-collapse:collapse;font-size:17px}
.hours td{padding:15px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:right;font-weight:600}
.about{margin-top:44px;padding-top:36px;border-top:1px solid var(--line)}
.about p{margin:14px 0 0;color:var(--muted)}

/* request */
.req{background:color-mix(in srgb,var(--brand) 7%,var(--paper));border-radius:36px;padding:72px;display:grid;grid-template-columns:.8fr 1.2fr;gap:64px}
.req h2{font-size:clamp(38px,4.4vw,56px)}
.req .side p{color:var(--muted)}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:600;text-decoration:none;margin-top:18px}
.req form input,.req form textarea,.req form select{border-color:transparent;font-family:inherit}
form .btn{width:100%}

.foot{padding:48px 0 60px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:15px}
.foot .word{font-size:22px;color:var(--ink)}
.callbar{display:none}

@media (max-width:900px){
  body{font-size:17px}
  .site-head nav,.site-head .tel{display:none}
  .hero{padding:20px 0 70px}
  .hero .wrap,.visit .wrap,.req{grid-template-columns:1fr;gap:44px}
  .figure{max-width:420px;margin:0 auto;width:100%}
  .stamp{left:-8px;bottom:24px;width:118px;height:118px}.stamp b{font-size:26px}
  .proof ul,.menu,.steps ol,.quote .more{grid-template-columns:1fr}
  .proof li+li{border-left:0;border-top:1px solid var(--line)}
  .head{flex-direction:column;align-items:flex-start;gap:16px}
  section.band{padding:76px 0}.quote{padding:80px 0}
  .req{padding:36px 22px;border-radius:26px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1;box-shadow:0 10px 28px rgba(0,0,0,.28)}
  .foot{padding-bottom:110px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
</style>

</head>
<body>
<div class="demo">Concept homepage for Lotus Hair Studio, made by a Royersford designer. Not live and not affiliated with the business.</div>

<header class="site-head" id="head"><div class="wrap bar"><a class="word" href="index.html">Lotus Hair <span>Studio</span></a><a class="tel" href="tel:+16109480500"><svg class="phi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>610-948-0500</a></div></header>
<section class="hero"><div class="wrap" style="display:block;max-width:820px">
  <h1>Thank <em>you.</em></h1>
  <p class="lead">We have your note and will be in touch soon. If it's time-sensitive, call <a href="tel:+16109480500">610-948-0500</a>.</p>
  <a class="btn soft" href="index.html">Back to the home page</a>
</div></section>
<script>
(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
  else els.forEach(el => el.classList.add('on'));
})();
</script>
</body>
</html>
