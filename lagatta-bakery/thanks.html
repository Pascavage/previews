<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | Lagatta Bakery</title>
<meta name="description" content="Butter croissants, stuffed pastries, focaccia and coffee drinks, made from scratch in downtown Hamburg. Come early. When the case is empty, we&#39;re done for the day.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6B2E2A">
<link rel="preload" href="fonts/playfair-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/playfair-display-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--paper:#FBF6EE;--ink:#2A1C14;--muted:#6E5E52;--line:#E8DCCB;--brand:#6B2E2A;--accent:#E9B872;--accent-ink:#2A1C14}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.demo{background:#111;color:#fff;font:500 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 16px}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.js .reveal.on{opacity:1;transform:none}

@font-face{font-family:'Playfair';src:url(fonts/playfair-display-latin-wght-normal.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:'Playfair';src:url(fonts/playfair-display-latin-wght-italic.woff2) format('woff2');font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans-latin-wght-normal.woff2) format('woff2');font-weight:100 1000;font-display:swap}
body{background:var(--paper);color:var(--ink);font:400 17.5px/1.7 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:'Playfair',Georgia,serif;font-weight:500;margin:0;line-height:1.04;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic;color:var(--brand)}
h2{font-size:clamp(40px,5vw,66px)}
.small{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.orn{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--brand);font-size:20px}
.orn::before,.orn::after{content:"";width:64px;height:1px;background:currentColor;opacity:.5}
.scallop{height:18px;background:radial-gradient(circle at 12px 0,var(--paper) 11.5px,transparent 12px) 0 0/24px 18px repeat-x}
.scallop.up{transform:scaleY(-1)}

/* masthead */
.site-head{position:sticky;top:0;z-index:20;background:var(--paper);transition:box-shadow .3s}
.site-head.scrolled{box-shadow:0 1px 0 var(--line),0 10px 30px -22px rgba(0,0,0,.4)}
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:84px;gap:20px}
.mast nav{display:flex;gap:26px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.mast nav a{text-decoration:none;color:var(--muted)}.mast nav a:hover{color:var(--brand)}
.mast nav.r{justify-content:flex-end}
.word{font-family:'Playfair',serif;font-style:italic;font-size:32px;font-weight:600;text-decoration:none;color:var(--brand);white-space:nowrap}
.phi{width:1em;height:1em}
.topline{background:var(--brand);color:#fff;text-align:center;font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:9px 16px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 14px/1 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:18px 30px;border-radius:2px;text-decoration:none;border:0;cursor:pointer;transition:background .2s,color .2s}
.btn.main{background:var(--brand);color:#fff}.btn.main:hover{background:color-mix(in srgb,var(--brand) 82%,#000)}
.btn.line{color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}.btn.line:hover{background:var(--brand);color:#fff}

/* hero */
.hero{padding:64px 0 100px;text-align:center;position:relative}
.hero h1{font-size:clamp(54px,8.6vw,128px);font-weight:500;margin:20px auto 0;max-width:12ch}
.oval{position:relative;width:min(520px,86vw);aspect-ratio:4/5;margin:-34px auto 0;border-radius:50%;background:var(--brand) var(--img,none) center/cover no-repeat;box-shadow:0 0 0 12px var(--paper),0 0 0 13.5px color-mix(in srgb,var(--brand) 45%,transparent),0 50px 90px -40px rgba(0,0,0,.45);z-index:-1}
.hero h1{position:relative;z-index:2;text-shadow:0 0 30px var(--paper),0 0 12px var(--paper)}
.oval .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:'Playfair',serif;font-style:italic;font-size:140px;color:#fff;opacity:.35}
.tag{position:absolute;right:-30px;top:18%;background:var(--accent);color:var(--accent-ink);font-family:'Playfair',serif;font-style:italic;font-size:22px;line-height:1.15;padding:22px 24px;border-radius:50%;width:150px;height:150px;display:grid;place-items:center;transform:rotate(9deg);box-shadow:0 14px 30px -14px rgba(0,0,0,.4)}
.hero .lead{max-width:34em;margin:44px auto 32px;font-size:19px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.rate{margin-top:26px;font-size:15px;color:var(--muted)}.rate b{color:var(--ink)}.rate .st{color:var(--accent);letter-spacing:3px;margin-right:8px}

/* proof */
.proof{background:var(--brand);color:#fff}
.proof ul{list-style:none;margin:0 auto;padding:30px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center}
.proof b{display:block;font-family:'Playfair',serif;font-style:italic;font-weight:500;font-size:28px}
.proof span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}

section.band{padding:110px 0}
.title{text-align:center;max-width:720px;margin:0 auto 64px}
.title h2{margin:16px 0 18px}.title p{color:var(--muted);margin:0}

/* the case */
.case{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
.case li{list-style:none;padding:40px 34px 44px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;transition:background .3s}
.case li:nth-child(3n){border-right:0}
.case li:hover{background:color-mix(in srgb,var(--accent) 14%,var(--paper))}
.case .no{font-family:'Playfair',serif;font-style:italic;font-size:46px;line-height:1;color:var(--accent)}
.case h3{font-size:27px;margin:18px 0 10px}
.case p{margin:0;color:var(--muted);font-size:16.5px}
.case .pr{position:absolute;top:40px;right:34px;font-family:'Playfair',serif;font-style:italic;color:var(--brand);font-size:20px}
.casewrap{padding:0}

/* review */
.rev{background:color-mix(in srgb,var(--brand) 8%,var(--paper));text-align:center}
.rev blockquote{margin:30px auto 0;max-width:900px}
.rev blockquote p{font-family:'Playfair',serif;font-style:italic;font-size:clamp(30px,4vw,50px);line-height:1.2;margin:0 0 22px}
.rev .more{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:960px;margin:64px auto 0;text-align:left}
.rev .more p{font-family:'Playfair',serif;font-size:21px;font-style:italic;margin:0 0 10px;line-height:1.4}

/* visit */
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.addr{font-family:'Playfair',serif;font-size:clamp(34px,4vw,50px);line-height:1.1;margin:16px 0}
.addr em{color:var(--brand)}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:15px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:right;font-family:'Playfair',serif;font-style:italic;font-size:19px}
.note{margin:24px 0 0;padding:20px 24px;border:1px dashed color-mix(in srgb,var(--brand) 50%,transparent);color:var(--brand);font-family:'Playfair',serif;font-style:italic;font-size:19px;text-align:center}
.about{color:var(--muted);margin:22px 0 30px}

/* request */
.req{background:#fff;border:1px solid var(--line);padding:70px;display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;position:relative}
.req::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none}
.req .bigtel{display:inline-flex;align-items:center;gap:10px;font-family:'Playfair',serif;font-size:30px;text-decoration:none;color:var(--brand);margin-top:18px}
.req form input,.req form textarea,.req form select{border-radius:2px}
form .btn{width:100%}

.foot{background:var(--ink);color:var(--paper);padding:56px 0 64px;text-align:center}
.foot .word{color:var(--paper);font-size:30px}
.foot p{margin:14px 0 0;opacity:.75;font-size:15px}
.callbar{display:none}

@media (max-width:900px){
  body{font-size:17px}
  .mast{grid-template-columns:1fr;justify-items:center;min-height:70px}.mast nav{display:none}
  .word{font-size:28px}
  .hero{padding:40px 0 70px}
  .oval{margin-top:-20px}
  .tag{right:-6px;width:112px;height:112px;font-size:17px;padding:14px}
  .proof ul,.case,.rev .more,.visit .wrap,.req{grid-template-columns:1fr}
  .case li{border-right:0}
  .visit .wrap,.req{gap:44px}
  section.band{padding:76px 0}
  .req{padding:40px 24px}
  .callbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.callbar .btn{flex:1;box-shadow:0 10px 28px rgba(0,0,0,.3)}
  .foot{padding-bottom:110px}
}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}form .full{grid-column:1/-1}
form label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
form input,form textarea,form select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-in,10px);background:#fff;color:var(--ink)}
form textarea{min-height:110px;resize:vertical}form button{width:100%}.hp{position:absolute;left:-9999px}
@media (max-width:700px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}.reveal{opacity:1;transform:none}}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Bakery","name":"Lagatta Bakery","telephone":"717-673-4562","address":"5 S Fourth St, Hamburg, PA 19526","email":"lagatta1103@gmail.com"}</script>
</head>
<body>
<div class="demo">Concept homepage for Lagatta Bakery, made by a Royersford designer. Not live and not affiliated with the business.</div>

<header class="site-head" id="head"><div class="wrap mast"><span></span><a class="word" href="index.html">Lagatta</a><span></span></div></header>
<section class="hero"><div class="wrap">
  <h1>Merci, <em>thank you.</em></h1>
  <p class="lead">We have your note and will be in touch soon. Questions? Call <a href="tel:+17176734562">717-673-4562</a>.</p>
  <a class="btn line" href="index.html">Back to the home page</a>
</div></section>
<script>
(() => { const h = document.getElementById('head'); if (h) { const f = () => h.classList.toggle('scrolled', scrollY > 8); f(); addEventListener('scroll', f, {passive:true}); }
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); o.unobserve(e.target); } }), {threshold:.12}); els.forEach(el => o.observe(el)); }
  else els.forEach(el => el.classList.add('on'));
})();
</script>
</body>
</html>
