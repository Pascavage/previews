.fx{color:var(--ink);padding:100px 0;background:color-mix(in srgb,var(--brand) 7%,var(--paper));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.fx-top{display:flex;justify-content:space-between;align-items:end;gap:28px;flex-wrap:wrap;margin-bottom:40px}
.fx-top p{margin:12px 0 0;max-width:34em;color:var(--muted)}
.fx-eye{display:inline-flex;align-items:center;gap:8px;font:800 12px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}

.fx-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card,18px);box-shadow:0 24px 50px -36px rgba(0,0,0,.45)}
.fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font:800 16px/1 system-ui,sans-serif;padding:17px 20px;border-radius:var(--r-btn,12px);border:0;background:var(--brand);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}

.fx-note{margin:12px 0 0;font-size:14px;color:var(--muted);text-align:center}
.fx-done{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,#fff);font-size:15px;line-height:1.45}

.cl-row button[aria-pressed=true]{background:var(--brand);color:#fff}
.cl-day[hidden]{display:none}
.trial{position:sticky;top:110px;padding:26px}
